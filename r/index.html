<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS ARMY Quiz 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06040C;
    color: #F1E9FF;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 320px; width: 100%; }
  .emoji { font-size: 64px; margin-bottom: 24px; display: block; }
  h1 {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #D946EF, #F9A8D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p { color: #8B7FA8; font-size: 14px; line-height: 1.6; }
  .dots { margin-top: 28px; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #D946EF;
    margin: 0 4px;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="card">
  <span class="emoji" id="ico">💜</span>
  <h1 id="title">BTS ARMY Quiz</h1>
  <p id="msg">Siendo redirigido a la tienda…</p>
  <div class="dots" id="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</div>

<script>
  function getCode() {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length >= 2) return parts[parts.length - 1];
    const q = new URLSearchParams(location.search);
    return q.get('ref') || q.get('code') || '';
  }

  const code    = getCode();
  const PACKAGE = 'com.andoisa.btstrivia';
  // Play Install Referrer: la app lo lee como ref=CODE (formato de app_links).
  const PLAY    = 'https://play.google.com/store/apps/details?id=' + PACKAGE
                + '&referrer=' + encodeURIComponent('ref=' + code);
  const APPSTORE = 'https://apps.apple.com/app/id_PENDING';

  const ua        = navigator.userAgent || '';
  const isAndroid = /android/i.test(ua);
  const isIOS     = /iphone|ipad|ipod/i.test(ua);

  const title = document.getElementById('title');
  const msg   = document.getElementById('msg');
  const dots  = document.getElementById('dots');
  const ico   = document.getElementById('ico');

  // App instalada: los App Links verificados (https borapp.click/r/…) abren la
  // app directamente sin cargar esta pagina. Si la pagina carga = no instalada
  // → a la tienda. (No se usa esquema custom: la app declara App Links https.)
  if (isAndroid) {
    setTimeout(() => { window.location.href = PLAY; }, 800);

  } else if (isIOS) {
    setTimeout(() => { window.location.href = APPSTORE; }, 800);

  } else {
    // Escritorio u otro dispositivo no compatible
    ico.textContent = '🖥️';
    title.textContent = 'Enlace para móvil';
    msg.textContent = 'Este enlace está diseñado para abrirse desde un teléfono Android o iPhone. Busca "BTS ARMY Quiz" en la tienda de tu dispositivo móvil.';
    dots.style.display = 'none';
  }
</script>
</body>
</html>
