<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS ARMY Quiz 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06040C;
    color: #F1E9FF;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 320px; width: 100%; }
  .emoji { font-size: 64px; margin-bottom: 24px; display: block; }
  h1 {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #D946EF, #F9A8D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p { color: #8B7FA8; font-size: 14px; line-height: 1.6; }
  .dots { margin-top: 28px; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #D946EF;
    margin: 0 4px;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="card">
  <span class="emoji" id="ico">💜</span>
  <h1 id="title">BTS ARMY Quiz</h1>
  <p id="msg">Siendo redirigido a la tienda…</p>
  <div class="dots" id="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</div>

<script>
  const path = window.location.pathname; // /r/ABC12345

  // Solo actuar si es una ruta de referido
  if (!path.startsWith('/r/') && !path.startsWith('/refer/')) {
    document.getElementById('ico').textContent = '😢';
    document.getElementById('title').textContent = 'Página no encontrada';
    document.getElementById('msg').textContent = 'El enlace que seguiste no existe.';
    document.getElementById('dots').style.display = 'none';
  } else {
    // Extraer código del path: /r/ABC12345 → ABC12345
    const segments = path.split('/').filter(Boolean);
    const code = segments[segments.length - 1] || '';

    const PACKAGE  = 'com.andoisa.btstrivia';
    const referrerParam = 'ref=' + encodeURIComponent(code);
    const PLAY     = 'https://play.google.com/store/apps/details?id=' + PACKAGE
                   + '&referrer=' + encodeURIComponent(referrerParam);
    const APPSTORE = 'https://apps.apple.com/app/id_PENDING';
    const DEEP     = 'btsarmyquiz://refer?ref=' + encodeURIComponent(code);

    const ua        = navigator.userAgent || '';
    const isAndroid = /android/i.test(ua);
    const isIOS     = /iphone|ipad|ipod/i.test(ua);

    if (isAndroid) {
      window.location.href = DEEP;
      setTimeout(() => { window.location.href = PLAY; }, 1200);
    } else if (isIOS) {
      window.location.href = DEEP;
      setTimeout(() => { window.location.href = APPSTORE; }, 1200);
    } else {
      document.getElementById('ico').textContent = '🖥️';
      document.getElementById('title').textContent = 'Enlace para móvil';
      document.getElementById('msg').textContent = 'Este enlace está diseñado para abrirse desde un teléfono Android o iPhone. Busca "BTS ARMY Quiz" en la tienda de tu dispositivo móvil.';
      document.getElementById('dots').style.display = 'none';
    }
  }
</script>
</body>
</html>
