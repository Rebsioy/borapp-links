<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bora Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #2b1748, #0b0712 68%); color: #f7f2ff; font-family: system-ui, sans-serif; text-align: center; }
    .card { width: min(380px, 100%); padding: 38px 28px; border: 1px solid rgba(179,148,255,.28); border-radius: 28px; background: rgba(24,15,42,.88); }
    .mark { width: 68px; height: 68px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(135deg,#9b5cff,#6d28d9); }
    .mark svg { width: 36px; height: 36px; fill: none; stroke: white; stroke-width: 1.8; }
    h1 { margin: 0 0 10px; font: 700 30px Georgia, serif; }
    p { margin: 0; color: #c9bddc; line-height: 1.55; }
    a { display: none; margin-top: 24px; padding: 14px 18px; border-radius: 16px; color: white; background: linear-gradient(135deg,#9b5cff,#6d28d9); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 5v22M24 5v22M8 16l8 9 8-9M8 16l8-9 8 9"/></svg></div>
    <h1 id="title">Bora Quiz</h1>
    <p id="message">Abriendo la aplicación...</p>
    <a id="store" href="#">Abrir en Google Play</a>
  </main>
  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const route = parts[0] || '';
      const query = new URLSearchParams(location.search);
      const code = (parts[1] || query.get('ref') || query.get('code') || '').trim();
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const store = document.getElementById('store');
      if (!['r', 'refer'].includes(route) || !code) {
        title.textContent = 'Enlace no válido';
        message.textContent = 'Este enlace de invitación no contiene un código válido.';
        return;
      }
      const play = 'https://play.google.com/store/apps/details?id=com.andoisa.btstrivia&referrer=' + encodeURIComponent('ref=' + code);
      store.href = play;
      store.style.display = 'block';
      if (/android/i.test(navigator.userAgent || '')) {
        message.textContent = 'Abriendo Bora Quiz o Google Play...';
        setTimeout(() => { location.href = play; }, 700);
      } else {
        title.textContent = 'Abre este enlace en Android';
        message.textContent = 'En Android, este enlace abre Bora Quiz y conserva tu código de invitación.';
      }
    })();
  </script>
</body>
</html>
